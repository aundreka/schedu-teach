<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 07 — One tap from lesson to quiz</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; min-height: 100vh; }
  body { background: #F4F6F8; display: flex; align-items: center; justify-content: center; }
  .stage { background: transparent; border: none; border-radius: 0; width: 700px; min-height: 0; padding: 44px 44px 60px; zoom: 1.4; }
  .stage-tools { display: none; }

  .duo { display: flex; align-items: center; gap: 26px; }

  /* ---- source lesson card ---- */
  .src {
    position: relative; width: 250px; flex: none;
    background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px 22px; box-shadow: 0 14px 30px rgba(var(--shadow), 0.10);
    opacity: 0; animation: s7srcIn 10s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite;
  }
  @keyframes s7srcIn {
    0%   { opacity: 0; transform: translateY(14px) scale(0.97); }
    4%   { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .subj { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cat-lesson-on); background: var(--cat-lesson-soft); border: 1px solid var(--cat-lesson-border); border-radius: 999px; padding: 4px 10px; margin-bottom: 11px; }
  .src b { display: block; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 10px; }
  .sbar { height: 7px; border-radius: 4px; background: var(--surface-alt); margin-bottom: 7px; }
  .genbtn {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 7px;
    margin-top: 15px; padding: 11px 0; border-radius: 12px;
    background: var(--tint); color: var(--on-tint); font-size: 12.5px; font-weight: 700;
    animation: s7press 10s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite;
  }
  @keyframes s7press {
    0%, 15%   { transform: scale(1); }
    16.5%     { transform: scale(0.955); }
    18%       { transform: scale(1); }
    100%      { transform: scale(1); }
  }
  .tapring { position: absolute; right: 26px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 999px; border: 3px solid var(--tint-deep); opacity: 0; animation: s7tap 10s ease-out infinite; }
  @keyframes s7tap {
    0%, 14.5% { opacity: 0; transform: scale(0.4); }
    16%       { opacity: 0.9; transform: scale(1); }
    21%       { opacity: 0; transform: scale(2.6); }
    100%      { opacity: 0; }
  }

  /* ---- generated quiz ---- */
  .paper { width: 330px; flex: none; opacity: 0; animation: s7paperIn 10s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite; }
  @keyframes s7paperIn {
    0%, 22% { opacity: 0; transform: translateY(16px) scale(0.96); }
    26%     { opacity: 1; transform: translateY(0) scale(1); }
    92%     { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .s7 .sweep { animation: s7sweep 10s linear infinite; }
  @keyframes s7sweep {
    0%, 26%  { opacity: 0; transform: translateY(0); }
    28%      { opacity: 1; }
    44%      { opacity: 1; transform: translateY(230px); }
    46%      { opacity: 0; transform: translateY(240px); }
    100%     { opacity: 0; }
  }
  .s7 .qbar::after { animation: s7ink 10s cubic-bezier(0.3, 0, 0.2, 1) infinite; animation-delay: var(--d, 0s); }
  @keyframes s7ink {
    0%   { transform: scaleX(0); }
    4%   { transform: scaleX(1); }
    100% { transform: scaleX(1); }
  }
  .s7 .choice { animation: s7pop 10s cubic-bezier(0.2, 0.9, 0.3, 1.4) infinite; animation-delay: var(--d); }
  @keyframes s7pop {
    0%   { opacity: 0; transform: scale(0.5); }
    3%   { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  .s7 .choice.key { border-color: var(--tint); background: var(--tint-soft); color: var(--tint-deep); }
  .exports { display: flex; gap: 9px; margin-top: 16px; }
  .filechip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--text);
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px;
    opacity: 0; animation: s7pop 10s cubic-bezier(0.2, 0.9, 0.3, 1.4) infinite; animation-delay: var(--d);
  }
  .filechip svg { display: block; }
  .s7 .gen-badge { animation: s7badge 10s cubic-bezier(0.2, 0.9, 0.3, 1.3) infinite; }
  @keyframes s7badge {
    0%, 76% { opacity: 0; transform: translateY(10px) scale(0.9); }
    81%     { opacity: 1; transform: translateY(0) scale(1); }
    92%     { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage s7" data-scene>
  <div class="duo" role="img" aria-label="Animation: a lesson card with a Generate activity button is tapped, a quiz sheet writes itself beside it, PDF and DOCX export chips pop in, and a Ready to print badge appears.">
    <div class="src">
      <span class="subj">Science 8 · Q2</span>
      <b>Lesson 12 · Photosynthesis</b>
      <div class="sbar" style="width: 100%"></div>
      <div class="sbar" style="width: 86%"></div>
      <div class="sbar" style="width: 62%"></div>
      <div class="genbtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z" fill="currentColor"/></svg>
        Generate activity
        <span class="tapring"></span>
      </div>
    </div>

    <div class="paper" style="position: relative; width: 330px;">
      <div class="sweep"></div>
      <div class="paper-head"><b>Quiz 6 · Photosynthesis</b><span>WRITTEN WORK · 10 ITEMS</span></div>
      <div class="qline"><span class="qnum">1.</span><div class="qbar" style="width: 100%; --d: 3.0s"></div></div>
      <div class="choices">
        <span class="choice" style="--d: 3.4s">A</span><span class="choice key" style="--d: 3.55s">B</span><span class="choice" style="--d: 3.7s">C</span><span class="choice" style="--d: 3.85s">D</span>
      </div>
      <div class="qline"><span class="qnum">2.</span><div class="qbar" style="--d: 4.2s"></div></div>
      <div class="choices">
        <span class="choice key" style="--d: 4.6s">A</span><span class="choice" style="--d: 4.75s">B</span><span class="choice" style="--d: 4.9s">C</span><span class="choice" style="--d: 5.05s">D</span>
      </div>
      <div class="qline"><span class="qnum">3.</span><div class="qbar" style="--d: 5.4s"></div></div>
      <div class="choices">
        <span class="choice" style="--d: 5.8s">A</span><span class="choice" style="--d: 5.95s">B</span><span class="choice" style="--d: 6.1s">C</span><span class="choice key" style="--d: 6.25s">D</span>
      </div>
      <div class="exports">
        <span class="filechip" style="--d: 6.8s">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="#FCA5A5"/><path d="M15 2v5h5" fill="#F87171"/></svg>
          PDF
        </span>
        <span class="filechip" style="--d: 7.1s">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="#93C5FD"/><path d="M15 2v5h5" fill="#60A5FA"/></svg>
          DOCX
        </span>
      </div>
      <span class="badge gen-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Quiz ready · straight from Lesson 12
      </span>
    </div>
  </div>
</div>
</body>
</html>
