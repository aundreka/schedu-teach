<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand sting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #ffffff; display: flex; align-items: center; justify-content: center;
    font-family: "Montserrat", -apple-system, system-ui, sans-serif;
  }
  .stack { display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* master timeline: 5 s seamless loop */
  @keyframes rise {
    0%      { opacity: 0; transform: translateY(26px) scale(0.96); }
    10%     { opacity: 1; transform: translateY(0) scale(1); }
    90%     { opacity: 1; transform: translateY(0) scale(1); }
    98%, 100% { opacity: 0; transform: translateY(0) scale(1); }
  }
  .logo, .word, .tag { opacity: 0; animation: rise 5s cubic-bezier(0.2, 0.75, 0.3, 1) infinite; }
  .logo { animation-delay: 0.15s; }
  .word { animation-delay: 0.55s; }
  .tag  { animation-delay: 0.85s; }

  /* S bars build inside the calendar */
  @keyframes barIn {
    0%   { opacity: 0; transform: translateX(-14px); }
    6%   { opacity: 1; transform: translateX(0); }
    90%  { opacity: 1; }
    98%, 100% { opacity: 0; }
  }
  .sbar { opacity: 0; animation: barIn 5s cubic-bezier(0.2, 0.75, 0.3, 1) infinite; animation-delay: var(--d); }

  .word { font-size: 128px; font-weight: 800; letter-spacing: 0.02em; color: #000; margin-top: 44px; }
  .word em { font-style: normal; color: #00bf63; }
  .tag { font-size: 38px; font-weight: 700; color: #6B7280; margin-top: 14px; }
</style>
</head>
<body>
  <div class="stack">
    <svg class="logo" width="380" height="380" viewBox="0 0 200 200" role="img" aria-label="SCHEDU logo">
      <rect x="14" y="26" width="172" height="160" rx="20" fill="#fff" stroke="#E5E7EB" stroke-width="3"/>
      <path d="M14 46 a20 20 0 0 1 20 -20 h132 a20 20 0 0 1 20 20 v26 H14 Z" fill="#00bf63"/>
      <rect x="52" y="10" width="14" height="30" rx="7" fill="#CFCFCF"/>
      <rect x="134" y="10" width="14" height="30" rx="7" fill="#CFCFCF"/>
      <g fill="#EDEDED">
        <rect x="32" y="86" width="30" height="16" rx="4"/><rect x="130" y="86" width="38" height="16" rx="4"/>
        <rect x="32" y="130" width="24" height="16" rx="4"/><rect x="144" y="130" width="24" height="16" rx="4"/>
        <rect x="32" y="158" width="38" height="16" rx="4"/><rect x="138" y="158" width="30" height="16" rx="4"/>
      </g>
      <g fill="#00bf63">
        <rect class="sbar" style="--d:0.45s" x="62" y="88" width="76" height="18" rx="3"/>
        <rect class="sbar" style="--d:0.55s" x="62" y="106" width="18" height="14" rx="3"/>
        <rect class="sbar" style="--d:0.65s" x="62" y="120" width="76" height="18" rx="3"/>
        <rect class="sbar" style="--d:0.75s" x="120" y="138" width="18" height="14" rx="3"/>
        <rect class="sbar" style="--d:0.85s" x="62" y="152" width="76" height="18" rx="3"/>
      </g>
    </svg>
    <div class="word">SCH<em>EDU</em></div>
    <div class="tag">your time belongs in a classroom</div>
  </div>
</body>
</html>
