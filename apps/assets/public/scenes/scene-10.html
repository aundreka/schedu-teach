<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 10 — Sunday, two ways</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; min-height: 100vh; }
  body { background: #F4F6F8; display: flex; align-items: center; justify-content: center; }
  .stage { background: transparent; border: none; border-radius: 0; width: 720px; min-height: 0; padding: 44px; zoom: 1.36; }
  .stage-tools { display: none; }

  .split { display: flex; gap: 22px; align-items: stretch; }
  .pane {
    position: relative; flex: 1; border-radius: 18px; padding: 20px 20px 22px; min-height: 330px;
    opacity: 0; animation: s10in 12s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite;
  }
  @keyframes s10in {
    0%   { opacity: 0; transform: translateY(14px); }
    3.5% { opacity: 1; transform: translateY(0); }
    92%  { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .pane.without { background: #ECEEF1; border: 1px solid #DFE3E8; }
  .pane.with { background: var(--bg); border: 1px solid var(--border); box-shadow: 0 16px 34px rgba(var(--shadow), 0.10); animation-delay: 0.25s; }

  .pane-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .pane-head b { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .without .pane-head b { color: var(--muted); }
  .with .pane-head b { color: var(--tint-deep); }
  .ptime { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; position: relative; width: 66px; height: 16px; text-align: right; }
  .ptime span { position: absolute; inset: 0; opacity: 0; }

  /* ---- left: the pile and the creeping clock ---- */
  .t1 { animation: s10t1 12s linear infinite; }
  .t2 { animation: s10t2 12s linear infinite; }
  .t3 { animation: s10t3 12s linear infinite; color: #B45309; font-weight: 700; }
  @keyframes s10t1 { 0%, 3.5% { opacity: 1; } 20%, 100% { opacity: 0; } }
  @keyframes s10t2 { 0%, 20% { opacity: 0; } 21%, 42% { opacity: 1; } 43%, 100% { opacity: 0; } }
  @keyframes s10t3 { 0%, 43% { opacity: 0; } 44%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }

  .pile { position: relative; height: 210px; }
  .sheet {
    position: absolute; left: 50%; width: 150px; height: 96px; margin-left: -75px;
    background: #FBFBF8; border: 1px solid #DDD9CC; border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 6px 14px rgba(var(--shadow), 0.08);
    opacity: 0; animation: s10sheet 12s cubic-bezier(0.2, 0.9, 0.3, 1.15) infinite; animation-delay: var(--d);
  }
  @keyframes s10sheet {
    0%   { opacity: 0; transform: translateY(-22px) rotate(var(--r)) scale(0.97); }
    3%   { opacity: 1; transform: translateY(0) rotate(var(--r)) scale(1); }
    92%  { opacity: 1; transform: translateY(0) rotate(var(--r)); }
    97%, 100% { opacity: 0; }
  }
  .sheet i { display: block; height: 6px; border-radius: 3px; background: #E7E3D6; margin-bottom: 7px; }
  .sheet i:nth-child(2) { width: 78%; }
  .sheet i:nth-child(3) { width: 60%; }
  .scrib {
    position: absolute; bottom: 12px; left: 20px; right: 20px; text-align: center;
    font-size: 11.5px; color: var(--muted); opacity: 0; animation: s10scrib 12s ease-out infinite;
  }
  @keyframes s10scrib {
    0%, 50% { opacity: 0; }
    56%     { opacity: 1; }
    92%     { opacity: 1; }
    97%, 100% { opacity: 0; }
  }

  /* ---- right: one tap, week fills, done ---- */
  .tapzone { position: relative; margin-bottom: 14px; }
  .planbtn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 0; border-radius: 11px; background: var(--tint); color: var(--on-tint);
    font-size: 12px; font-weight: 700;
    animation: s10press 12s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite;
  }
  @keyframes s10press {
    0%, 11%  { transform: scale(1); }
    12.5%    { transform: scale(0.96); }
    14%      { transform: scale(1); }
    100%     { transform: scale(1); }
  }
  .tapring2 { position: absolute; right: 30px; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 999px; border: 3px solid var(--tint-deep); opacity: 0; animation: s10tap 12s ease-out infinite; }
  @keyframes s10tap {
    0%, 10.5% { opacity: 0; transform: scale(0.4); }
    12%       { opacity: 0.9; transform: scale(1); }
    16%       { opacity: 0; transform: scale(2.6); }
    100%      { opacity: 0; }
  }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mcell { height: 40px; border-radius: 9px; border: 1.5px dashed var(--border); background: var(--bg); position: relative; }
  .mblock {
    position: absolute; inset: 0; border-radius: 9px; border: 1px solid;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
    opacity: 0; animation: s10block 12s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite; animation-delay: var(--d);
  }
  @keyframes s10block {
    0%   { opacity: 0; transform: translateY(-10px) scale(0.95); }
    2.5% { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .mb-l { background: var(--cat-lesson-soft); color: var(--cat-lesson-on); border-color: var(--cat-lesson-border); }
  .mb-w { background: var(--cat-ww-soft); color: var(--cat-ww-on); border-color: var(--cat-ww-border); }
  .mb-p { background: var(--cat-pt-soft); color: var(--cat-pt-on); border-color: var(--cat-pt-border); }
  .mb-e { background: var(--cat-exam-soft); color: var(--cat-exam-on); border-color: var(--cat-exam-border); }
  .with .badge { position: absolute; bottom: -16px; right: 16px; white-space: nowrap; opacity: 0; animation: s10badge 12s cubic-bezier(0.2, 0.9, 0.3, 1.3) infinite; }
  @keyframes s10badge {
    0%, 52% { opacity: 0; transform: translateY(9px) scale(0.9); }
    57%     { opacity: 1; transform: translateY(0) scale(1); }
    92%     { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage s10" data-scene>
  <div class="split" role="img" aria-label="Animation: a split screen compares two Sunday evenings. Without SCHEDU, papers pile up and the clock creeps to 11:04 PM. With SCHEDU, one tap fills the week and a Done badge lands at 7:15 PM.">
    <div class="pane without">
      <div class="pane-head">
        <b>Without</b>
        <span class="ptime">
          <span class="t1">8:00 PM</span>
          <span class="t2">9:30 PM</span>
          <span class="t3">11:04 PM</span>
        </span>
      </div>
      <div class="pile">
        <div class="sheet" style="--d: 1.2s; --r: -4deg; top: 6px"><i style="width:90%"></i><i></i><i></i></div>
        <div class="sheet" style="--d: 2.8s; --r: 3deg; top: 44px"><i style="width:84%"></i><i></i><i></i></div>
        <div class="sheet" style="--d: 4.4s; --r: -2deg; top: 84px"><i style="width:92%"></i><i></i><i></i></div>
        <div class="sheet" style="--d: 6.0s; --r: 5deg; top: 122px"><i style="width:80%"></i><i></i><i></i></div>
      </div>
      <div class="scrib">Still planning</div>
    </div>

    <div class="pane with">
      <div class="pane-head">
        <b>With SCHEDU</b>
        <span class="ptime"><span style="opacity:1">7:15 PM</span></span>
      </div>
      <div class="tapzone">
        <div class="planbtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z" fill="currentColor"/></svg>
          Plan the term
          <span class="tapring2"></span>
        </div>
      </div>
      <div class="mini">
        <div class="mcell"><div class="mblock mb-l" style="--d: 2.0s">Lesson 1</div></div>
        <div class="mcell"><div class="mblock mb-l" style="--d: 2.4s">Lesson 2</div></div>
        <div class="mcell"><div class="mblock mb-w" style="--d: 2.8s">Quiz 1</div></div>
        <div class="mcell"><div class="mblock mb-l" style="--d: 3.2s">Lesson 3</div></div>
        <div class="mcell"><div class="mblock mb-p" style="--d: 3.6s">Perf. Task</div></div>
        <div class="mcell"><div class="mblock mb-l" style="--d: 4.0s">Lesson 4</div></div>
        <div class="mcell"><div class="mblock mb-w" style="--d: 4.4s">Quiz 2</div></div>
        <div class="mcell"><div class="mblock mb-l" style="--d: 4.8s">Lesson 5</div></div>
        <div class="mcell"><div class="mblock mb-e" style="--d: 5.2s">Exam</div></div>
      </div>
      <span class="badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Done · evening is yours
      </span>
    </div>
  </div>
</div>
</body>
</html>
