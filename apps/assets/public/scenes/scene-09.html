<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 09 — The 15 minute Sunday</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; min-height: 100vh; }
  body { background: #F4F6F8; display: flex; align-items: center; justify-content: center; }
  .stage { background: transparent; border: none; border-radius: 0; width: 680px; min-height: 0; padding: 44px 44px 60px; zoom: 1.42; }
  .stage-tools { display: none; }

  .duo { display: flex; align-items: center; gap: 40px; }

  /* ---- the clock ---- */
  .clockwrap { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: none; opacity: 0; animation: s9in 10s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite; }
  @keyframes s9in {
    0%   { opacity: 0; transform: translateY(12px); }
    4%   { opacity: 1; transform: translateY(0); }
    91%  { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .clock { position: relative; width: 190px; height: 190px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 16px 34px rgba(var(--shadow), 0.10); }
  .clock svg { position: absolute; inset: 0; }
  .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 4px; }
  .hand.hour { width: 6px; height: 44px; margin-left: -3px; background: var(--text); transform: rotate(217.5deg); animation: s9hour 10s linear infinite; }
  @keyframes s9hour {
    0%, 10% { transform: rotate(217.5deg); }
    78%     { transform: rotate(225deg); }
    100%    { transform: rotate(225deg); }
  }
  .hand.minute { width: 5px; height: 64px; margin-left: -2.5px; background: var(--tint-deep); animation: s9minute 10s linear infinite; }
  @keyframes s9minute {
    0%, 10% { transform: rotate(0deg); }
    78%     { transform: rotate(90deg); }
    100%    { transform: rotate(90deg); }
  }
  .pin { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 999px; background: var(--text); }
  .clock-cap { position: relative; font-family: var(--mono); font-size: 13px; color: var(--muted); height: 20px; width: 130px; text-align: center; }
  .clock-cap span { position: absolute; inset: 0; }
  .cap-start { animation: s9capA 10s linear infinite; }
  .cap-end { opacity: 0; animation: s9capB 10s linear infinite; }
  @keyframes s9capA {
    0%, 72%  { opacity: 1; }
    76%, 100% { opacity: 0; }
  }
  @keyframes s9capB {
    0%, 74%  { opacity: 0; }
    78%      { opacity: 1; }
    91%      { opacity: 1; }
    97%, 100% { opacity: 0; }
  }

  /* ---- the checklist ---- */
  .list { position: relative; width: 330px; flex: none; }
  .item {
    display: flex; align-items: center; gap: 13px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 16px; margin-bottom: 10px;
    box-shadow: 0 8px 20px rgba(var(--shadow), 0.07);
    opacity: 0; animation: s9item 10s cubic-bezier(0.2, 0.9, 0.3, 1.2) infinite; animation-delay: var(--d);
  }
  @keyframes s9item {
    0%   { opacity: 0; transform: translateX(16px); }
    3.5% { opacity: 1; transform: translateX(0); }
    91%  { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
  .item .ck { width: 22px; height: 22px; border-radius: 999px; background: var(--tint); display: flex; align-items: center; justify-content: center; flex: none; animation: s9ck 10s cubic-bezier(0.2, 0.9, 0.3, 1.5) infinite; animation-delay: var(--d); }
  @keyframes s9ck {
    0%   { transform: scale(0); }
    2.5% { transform: scale(0); }
    4.5% { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .item b { font-size: 13.5px; letter-spacing: -0.01em; }
  .item b i { font-style: normal; font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--tint-deep); }
  .item span { display: block; font-size: 11px; color: var(--muted); }
  .list .badge { position: absolute; bottom: -40px; right: 0; opacity: 0; animation: s9badge 10s cubic-bezier(0.2, 0.9, 0.3, 1.3) infinite; }
  @keyframes s9badge {
    0%, 78% { opacity: 0; transform: translateY(10px) scale(0.9); }
    83%     { opacity: 1; transform: translateY(0) scale(1); }
    91%     { opacity: 1; }
    97%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage s9" data-scene>
  <div class="duo" role="img" aria-label="Animation: a clock sweeps from 7:00 to 7:15 on a Sunday evening while a checklist ticks off subjects planned, sessions scheduled, quizzes generated, and the week synced, ending with a badge that says 15 minutes, Sunday is yours.">
    <div class="clockwrap">
      <div class="clock">
        <svg viewBox="0 0 190 190" aria-hidden="true">
          <g stroke="#D3D9E0" stroke-width="3" stroke-linecap="round">
            <path d="M95 14v12"/><path d="M95 164v12"/><path d="M14 95h12"/><path d="M164 95h12"/>
          </g>
          <g stroke="#E8ECF0" stroke-width="2.5" stroke-linecap="round">
            <path d="M135.5 24.9l-6 10.4"/><path d="M60.5 154.7l-6 10.4"/>
            <path d="M165.1 54.5l-10.4 6"/><path d="M35.3 129.5l-10.4 6"/>
            <path d="M54.5 24.9l6 10.4"/><path d="M129.5 154.7l6 10.4"/>
            <path d="M24.9 54.5l10.4 6"/><path d="M154.7 129.5l10.4 6"/>
          </g>
        </svg>
        <span class="hand hour"></span>
        <span class="hand minute"></span>
        <span class="pin"></span>
      </div>
      <div class="clock-cap">
        <span class="cap-start">SUN · 7:00 PM</span>
        <span class="cap-end">SUN · 7:15 PM</span>
      </div>
    </div>

    <div class="list">
      <div class="item" style="--d: 1.6s">
        <span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="#07301A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><b><i>4</i> subjects planned</b><span>Math, Science 7 and 8, English</span></div>
      </div>
      <div class="item" style="--d: 3.0s">
        <span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="#07301A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><b><i>36</i> sessions scheduled</b><span>Lessons, quizzes, buffers, exams</span></div>
      </div>
      <div class="item" style="--d: 4.4s">
        <span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="#07301A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><b><i>3</i> quizzes generated</b><span>Printable, PDF and DOCX</span></div>
      </div>
      <div class="item" style="--d: 5.8s">
        <span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="#07301A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><b>Week synced to calendar</b><span>Every class knows its lesson</span></div>
      </div>
      <span class="badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        15 minutes · Sunday is yours
      </span>
    </div>
  </div>
</div>
</body>
</html>
