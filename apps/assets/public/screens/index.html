<style>
  :root {
    --green: #00bf63; --black: #000; --paper: #f9f9f9;
    --muted: #6B7280; --border: #E5E7EB;
    --font: "Montserrat", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--black); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  main { max-width: 1180px; margin: 0 auto; padding: 0 24px 90px; }
  header.top { padding: 44px 0 6px; }
  a.back { font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none; }
  a.back:hover { text-decoration: underline; }
  h1 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 800; margin: 12px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .toolbar { position: sticky; top: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(8px); padding: 12px 0 12px; z-index: 10; border-bottom: 1px solid var(--paper); }
  .toolbar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search {
    flex: 1 1 220px; max-width: 320px;
    font: 600 13px/1 var(--font); color: var(--black);
    border: 1.5px solid var(--border); border-radius: 999px; padding: 11px 18px; background: #fff;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .search:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,191,99,0.15); }
  .seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button {
    font: 700 12px/1 var(--font); color: var(--muted); background: #fff; border: none;
    padding: 11px 16px; cursor: pointer; transition: background 0.18s ease, color 0.18s ease;
  }
  .seg button[aria-pressed="true"] { background: var(--green); color: var(--black); }
  .seg button:focus-visible { outline: 3px solid var(--green); outline-offset: -3px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    font: 700 12px/1 var(--font); color: var(--muted); background: #fff;
    border: 1.5px solid var(--border); border-radius: 999px; padding: 9px 14px; cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .chip:hover { border-color: var(--green); color: var(--black); transform: translateY(-1px); }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--black); }
  .chip i { font-style: normal; opacity: 0.55; margin-left: 2px; }
  .chip:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  .count-line { font-size: 12.5px; color: var(--muted); margin: 16px 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
  .shot { margin: 0; opacity: 0; transform: translateY(18px); transition: opacity 0.5s cubic-bezier(0.2,0.7,0.3,1), transform 0.5s cubic-bezier(0.2,0.7,0.3,1); }
  .shot.in { opacity: 1; transform: none; }
  .shot.hidden { display: none; }
  .shot-btn { display: block; width: 100%; border: none; padding: 0; background: none; cursor: zoom-in; border-radius: 18px; }
  .shot-btn:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .shot img {
    width: 100%; display: block; border-radius: 18px; border: 1px solid var(--border);
    transition: transform 0.22s cubic-bezier(0.2,0.7,0.3,1), box-shadow 0.22s ease;
  }
  .shot-btn:hover img { transform: translateY(-3px) scale(1.015); box-shadow: 0 14px 30px rgba(0,0,0,0.12); }
  .shot figcaption { padding: 8px 4px 0; }
  .shot figcaption b { display: block; font-size: 12px; font-weight: 700; }
  .shot figcaption span { font-size: 11px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 0; display: none; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 4vh 4vw;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: absolute; top: 18px; right: 18px;
    width: 44px; height: 44px; border-radius: 999px; border: none; cursor: pointer;
    background: #fff; color: #000; font-size: 20px; font-weight: 700; line-height: 1;
  }
  .lightbox-close:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .shot { opacity: 1; transform: none; }
  }
</style>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot preview">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close preview">&times;</button>
  <img id="lightbox-img" src="" alt="Screenshot preview">
</div>

<script>
(function () {
  "use strict";
  var state = { sec: "all", mode: "all", q: "" };
  var shots = Array.prototype.slice.call(document.querySelectorAll(".shot"));
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var io = null;
  if (!reduced && "IntersectionObserver" in window) {
    var pending = [], flushTimer = null;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { pending.push(e.target); io.unobserve(e.target); }
      });
      if (!flushTimer) flushTimer = setTimeout(function () {
        pending.forEach(function (el, i) {
          setTimeout(function () { el.classList.add("in"); }, i * 45);
        });
        pending = []; flushTimer = null;
      }, 40);
    }, { rootMargin: "80px" });
    shots.forEach(function (s) { io.observe(s); });
  } else {
    shots.forEach(function (s) { s.classList.add("in"); });
  }

  function apply() {
    var visible = 0;
    shots.forEach(function (s) {
      var ok = (state.sec === "all" || s.dataset.sec === state.sec)
        && (state.mode === "all" || s.dataset.mode === state.mode)
        && (!state.q || s.dataset.name.indexOf(state.q) !== -1);
      s.classList.toggle("hidden", !ok);
      if (ok) {
        visible++;
        if (!s.classList.contains("in")) {
          if (io) io.unobserve(s);
          s.classList.add("in");
        }
      }
    });
    countEl.textContent = "Showing " + visible + " of 108";
    emptyEl.style.display = visible ? "none" : "block";
  }

  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () {
      state.sec = c.dataset.sec;
      document.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", String(o === c)); });
      apply();
    });
  });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.mode = b.dataset.mode;
      document.querySelectorAll(".seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      apply();
    });
  });
  var qEl = document.getElementById("q");
  qEl.addEventListener("input", function () { state.q = qEl.value.trim().toLowerCase(); apply(); });

  /* lightbox with focus management */
  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lightbox-img");
  var lbClose = document.getElementById("lightbox-close");
  var lastTrigger = null;
  function openLb(src, trigger) {
    lastTrigger = trigger;
    lbImg.src = src;
    lb.classList.add("open");
    lbClose.focus();
  }
  function closeLb() {
    lb.classList.remove("open");
    lbImg.src = "";
    if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
  }
  document.querySelectorAll(".shot-btn").forEach(function (b) {
    b.addEventListener("click", function () { openLb(b.dataset.full, b); });
  });
  lbClose.addEventListener("click", closeLb);
  lb.addEventListener("click", function (e) { if (e.target === lb || e.target === lbImg) closeLb(); });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "Tab") { e.preventDefault(); lbClose.focus(); }
  });

  apply();
})();
</script>
